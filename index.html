<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Giáo Dục Kinh Tế Và Pháp Luật - Giữa Kỳ I Khối 12</title>
    <style>
        :root {
            --primary-color: #1a5f7a;
            --secondary-color: #002b5b;
            --accent-color: #57c5b6;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2b2d42;
            --success-color: #28a745;
            --error-color: #dc3545;
            --border-color: #e9ecef;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            color: white;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .quiz-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        .section-header {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .info-box {
            background-color: #eef7f6;
            border-left: 4px solid var(--accent-color);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
            font-style: italic;
        }

        .question-title {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 15px;
            color: var(--secondary-color);
        }

        .options-list {
            list-style: none;
        }

        .option-item {
            margin-bottom: 10px;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-label:hover {
            background-color: #f1f5f9;
border-color: var(--primary-color);
        }

        .option-label input {
            margin-right: 12px;
            margin-top: 4px;
        }

        /* True/False Table Styling */
        .tf-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .tf-table th, .tf-table td {
            padding: 12px;
            border: 1px solid var(--border-color);
            text-align: left;
        }

        .tf-table th {
            background-color: #f1f5f9;
            color: var(--secondary-color);
        }

        .tf-table td.center {
            text-align: center;
            width: 80px;
        }

        .explanation {
            margin-top: 15px;
            padding: 12px 15px;
            border-radius: 6px;
            display: none;
            font-size: 0.95rem;
        }

        .explanation.visible {
            display: block;
        }

        .explanation.correct {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .explanation.incorrect {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .action-container {
            text-align: center;
            margin: 30px 0;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:hover {
            background-color: var(--secondary-color);
        }

        #result-card {
            display: none;
            text-align: center;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .score-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 15px 0;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .quiz-card {
                padding: 15px;
            }
            .tf-table th, .tf-table td {
                padding: 8px 5px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
